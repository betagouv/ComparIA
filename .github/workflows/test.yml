name: Tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - develop

# A newer pull request run supersedes the older one. Pushes are never
# cancelled, so every merge into develop gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Check formatting
        run: |
          uv run --locked --group dev black --check backend utils tests internal
          uv run --locked --group dev isort --check-only backend utils tests internal

      - name: Run backend tests
        run: uv run --locked --group dev --group data pytest tests -q

      # Only the modules held to the strict flags in pyproject.toml. Imports
      # are followed silently, so the errors elsewhere do not fail this step.
      - name: Type check the strict modules
        run: |
          uv run --locked --group dev python - <<'EOF'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              blocks = tomllib.load(f)["tool"]["mypy"].get("overrides", [])
          targets = []
          for block in blocks:
              if block.get("disallow_untyped_defs"):
                  modules = block["module"]
                  for module in [modules] if isinstance(modules, str) else modules:
                      if module.endswith(".*"):
                          targets += ["-p", module[:-2]]
                      else:
                          targets += ["-m", module]
          if not targets:
              sys.exit("No module is held to the strict flags in pyproject.toml")
          mypy = [sys.executable, "-m", "mypy", "--follow-imports=silent"]
          sys.exit(subprocess.call(mypy + targets))
          EOF

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: |
          yarn lint
          yarn format

      - name: Run frontend tests
        working-directory: frontend
        run: yarn vitest run

      - name: Build frontend
        working-directory: frontend
        run: yarn build
