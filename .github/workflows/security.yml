name: Security

permissions:
  contents: read

# Pull requests and pushes to the integration branches are scanned as they
# happen. The weekly run picks up new CodeQL queries without waiting for a
# push; gitleaks skips it, there are no new commits to scan.
on:
  pull_request:
  push:
    branches:
      - develop
      - next
  schedule:
    - cron: '17 4 * * 1'

# A newer pull request run supersedes the older one. Pushes are never
# cancelled: the gitleaks range of a cancelled push would never be scanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The gitleaks GitHub action wants a licence key for organisations, the
      # binary does not. Pinned by version and checksum.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      # Only the commits this event brings: the pull request's range, or the
      # pushed range on develop or next. Older history is not rescanned on
      # every run. After a force-push, or on the first push of a branch,
      # `before` is not an ancestor of `sha` (or is all zeros), so the range
      # falls back to the pushed commit alone, diffed against its first parent
      # so a merge commit still yields something to scan: everything on these
      # branches arrived through a scanned PR.
      - name: Scan the new commits for leaked secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] && ! git merge-base --is-ancestor "$BASE" "$HEAD_SHA" 2>/dev/null; then
            RANGE="-m --first-parent -n 1 $HEAD_SHA"
          else
            RANGE="$BASE..$HEAD_SHA"
          fi
          gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts "$RANGE" .
