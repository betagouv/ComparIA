name: Build and push to the prototype registry

permissions:
  contents: read

on:
  push:
    branches:
      - infra_proto_deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
      GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}

      - name: Build and push the images
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: docker buildx bake -f devops/docker/docker-bake.yml --push

      - name: Package and push the chart
        run: |
          helm package devops/helm/comparia \
            --version "0.1.${{ github.run_number }}" \
            --app-version "${{ github.sha }}"
          helm push "comparia-0.1.${{ github.run_number }}.tgz" "oci://${REGISTRY}"
