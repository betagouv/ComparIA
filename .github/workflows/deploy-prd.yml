name: Deploy to Production

permissions:
  contents: read

on:
  push:
    branches:
      - prd

jobs:
  check-images-prd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get full commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "Commit hash: $COMMIT_HASH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-jenkins

      - name: Check images in production registry
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          python docker/jenkins/trigger_check_images_prd.py \
            --url "$JENKINS_URL" \
            --username "$JENKINS_USERNAME" \
            --token "$JENKINS_API_TOKEN" \
            --commit-hash "${{ steps.commit.outputs.hash }}"

  deploy-prd:
    runs-on: ubuntu-latest
    needs: [check-images-prd]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get full commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "Commit hash: $COMMIT_HASH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-jenkins

      - name: Trigger deploy to production
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          python docker/jenkins/trigger_deploy_prd.py \
            --url "$JENKINS_URL" \
            --username "$JENKINS_USERNAME" \
            --token "$JENKINS_API_TOKEN" \
            --image-tag "${{ steps.commit.outputs.hash }}" \
            --wait
