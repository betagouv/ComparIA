name: Promote and Deploy to Staging

permissions:
  contents: read

on:
  push:
    branches:
      - stg

jobs:
  promote-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get full commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "Commit hash: $COMMIT_HASH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-jenkins

      - name: Trigger image promotion
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          python docker/jenkins/trigger_image_promotion.py \
            --url "$JENKINS_URL" \
            --username "$JENKINS_USERNAME" \
            --token "$JENKINS_API_TOKEN" \
            --source-tag "${{ steps.commit.outputs.hash }}" \
            --target-tag "${{ steps.commit.outputs.hash }}"

  deploy-stg:
    runs-on: ubuntu-latest
    needs: [promote-images]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get full commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "Commit hash: $COMMIT_HASH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-jenkins

      - name: Trigger deploy to staging
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          python docker/jenkins/trigger_deploy_stg.py \
            --url "$JENKINS_URL" \
            --username "$JENKINS_USERNAME" \
            --token "$JENKINS_API_TOKEN" \
            --image-tag "${{ steps.commit.outputs.hash }}" \
            --wait
