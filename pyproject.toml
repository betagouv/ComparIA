[project]
name = "languia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ecologits==0.10.2",
    "fastapi>=0.138.1",
    "json5>=0.15.0",
    "litellm==1.88.0",
    "google-auth>=2.55.1",
    "httpx>=0.28.1",
    "markdown>=3.10.2",
    "numpy>=2.5.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "sqlalchemy>=2.0.51",
    "pydantic-settings>=2.14.2",
    "python-logging-loki>=0.3.1",
    "redis[hiredis]>=8.0.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentry-sdk>=2.63.0",
    "uvicorn>=0.49.0",
    "altcha>=1.0.0,<2.0.0",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.5",
    "linkup-sdk>=0.18.2",
    "async-lru>=2.3.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
data = [
    "duckdb>=1.4.4",
    "pandas>=3.0.0",
    "polars>=1.42.0",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=24.0.0",
    "huggingface_hub>=1.21.0",
    "google-cloud-aiplatform>=1.158.0",
    "cyclopts>=4.19.0",
]
devops = [
    "cyclopts>=4.19.0",
    "keyring>=25.7.0",
    "pykeepass>=4.0.0",
]
dev = [
    "autoflake>=2.3.3",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "python-jenkins>=1.8.3",
    "types-markdown>=3.10.2.20260518",
    "types-psycopg2>=2.9.21.20260518",
    "types-requests>=2.33.0.20260518",
    "pydantic-to-typescript>=2.0.0",
]

[tool.mypy]
exclude = ["utils/ranking_methods"]
exclude_gitignore = true
check_untyped_defs = true
# disallow_untyped_defs = true

[tool.autoflake]
recursive = true
in-place = true
remove-all-unused-imports = true
exclude= [
    "./**/__init__.py",
    "./utils/ranking_methods",
    "./utils/database/actions/__init__.py",
    "./utils/database/alembic",
    "./internal/typescript/backend_types.py",
    "./internal/typescript/admin_types.py"
]

[tool.isort]
profile = "black"
extend_skip = ["utils/ranking_methods", "utils/database/alembic"]

[tool.black]
extend-exclude = "utils/ranking_methods|utils/database/alembic"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "utils*"]
