[project]
name = "languia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ecologits==0.10.2",
    "fastapi>=0.128.0",
    "json5>=0.13.0",
    "litellm==1.88.0",
    "google-auth>=2.38.0",
    "httpx>=0.28.1",
    "markdown>=3.10.1",
    "numpy>=2.4.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "sqlalchemy>=2.0.46",
    "pydantic-settings>=2.12.0",
    "python-logging-loki>=0.3.1",
    "redis[hiredis]>=7.1.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "sentry-sdk>=2.50.0",
    "uvicorn>=0.40.0",
    "altcha>=1.0.0,<2.0.0",
    "sqlmodel>=0.0.38",
    "psycopg[binary]>=3.3.3",
    "alembic>=1.18.4",
    "linkup-sdk>=0.13.0",
    "async-lru>=2.3.0",
]

[dependency-groups]
data = [
    "duckdb>=1.1.0",
    "pandas>=3.0.0",
    "polars>=1.37.1",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.0",
    "huggingface_hub>=1.4",
    "google-cloud-aiplatform>=1.75.0",
    "cyclopts>=4.7.0",
]
devops = [
    "cyclopts>=4.7.0",
    "keyring>=25.0.0",
    "pykeepass>=4.0.0",
]
dev = [
    "autoflake>=2.3.1",
    "black>=26.1.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "python-jenkins>=1.8.3",
    "types-markdown>=3.10.0.20251106",
    "types-psycopg2>=2.9.21.20251012",
    "types-requests>=2.32.4.20260107",
    "pydantic-to-typescript>=2.0.0",
]

[tool.mypy]
exclude = ["utils/ranking_methods"]
exclude_gitignore = true
check_untyped_defs = true
# disallow_untyped_defs = true

[tool.autoflake]
recursive = true
in-place = true
remove-all-unused-imports = true
exclude= [
    "./**/__init__.py",
    "./utils/ranking_methods",
    "./utils/database/actions/__init__.py",
    "./utils/database/alembic",
    "./internal/typescript/backend_types.py",
    "./internal/typescript/admin_types.py"
]

[tool.isort]
profile = "black"
extend_skip = ["utils/ranking_methods", "utils/database/alembic"]

[tool.black]
extend-exclude = "utils/ranking_methods|utils/database/alembic"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "utils*"]
