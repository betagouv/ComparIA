  # Project composition
  - {from: project_comparag, rel: USES, to: tool_clarifeye}
  - {from: project_comparag, rel: USES, to: tool_langchain_rag}

  # Bug → cause
  - {from: bug_clarifeye_first_call_fails, rel: CAUSED_BY, to: cause_oauth_cold_start}
  - {from: bug_clarifeye_first_call_fails, rel: CAUSED_BY, to: cause_refresh_rotation_overwrite}
  - {from: bug_silent_logs, rel: CAUSED_BY, to: cause_logger_misconfigured}
  - {from: bug_silent_logs, rel: BLOCKED_DIAGNOSIS_OF, to: bug_truncation}
  - {from: bug_silent_logs, rel: BLOCKED_DIAGNOSIS_OF, to: bug_clarifeye_first_call_fails}
  - {from: bug_truncation, rel: CAUSED_BY, to: cause_mediation_oversummarizes}
  - {from: bug_clarifeye_timeout, rel: CAUSED_BY, to: cause_short_default_timeout}
  - {from: bug_clarifeye_timeout, rel: CAUSED_BY, to: cause_no_retry_on_transient}
  - {from: bug_vote_silent_failure, rel: CAUSED_BY, to: cause_handlevote_swallows_errors}

  # Bug → affects
  - {from: bug_clarifeye_first_call_fails, rel: AFFECTS, to: tool_clarifeye}
  - {from: bug_clarifeye_timeout, rel: AFFECTS, to: tool_clarifeye}
  - {from: bug_truncation, rel: AFFECTS, to: project_comparag}

  # Fix → root cause
  - {from: fix_oauth_prewarm, rel: ADDRESSES, to: cause_oauth_cold_start}
  - {from: fix_bootstrap_seed_only, rel: ADDRESSES, to: cause_refresh_rotation_overwrite}
  - {from: fix_logger_rename, rel: ADDRESSES, to: cause_logger_misconfigured}
  - {from: fix_diagnostic_logs, rel: ENABLED_DIAGNOSIS_OF, to: cause_mediation_oversummarizes}
  - {from: fix_mediation_toggle, rel: ADDRESSES, to: cause_mediation_oversummarizes}
  - {from: fix_per_server_timeout_and_retry, rel: ADDRESSES, to: cause_short_default_timeout}
  - {from: fix_per_server_timeout_and_retry, rel: ADDRESSES, to: cause_no_retry_on_transient}
  - {from: fix_handlevote_ui_feedback, rel: ADDRESSES, to: cause_handlevote_swallows_errors}
  - {from: fix_mediation_max_tokens, rel: ATTEMPTED_TO_FIX, to: cause_mediation_oversummarizes}

  # Fix dependency chain (chronological discovery order)
  - {from: fix_diagnostic_logs, rel: DEPENDS_ON, to: fix_logger_rename}
  - {from: fix_mediation_toggle, rel: DEPENDS_ON, to: fix_diagnostic_logs}

# ---------------------------------------------------------------------------
# Propagable learnings (carry these forward to all future sessions)
# ---------------------------------------------------------------------------

learnings:
  - text: "backend/logger.py only configures handlers for the 'languia' logger — any other name produces silent logs in production."
    tags: [logging, observability, comparag]

  - text: "Clarifeye rotates refresh_tokens. Storage is authoritative; env-var bootstrap must be strictly one-time seed."
    tags: [oauth, clarifeye, refresh-token-rotation]

  - text: "OAuth provider construction is lazy by default. Pre-warm at FastAPI startup so the first user request doesn't pay the cold-start cost (discovery + refresh + MCP init in one timeout window)."
    tags: [oauth, mcp, performance]

  - text: "mistral-small ignores 'do not summarize' instructions in mediation prompts. Use claude-haiku or bypass mediation when output fidelity matters."
    tags: [llm, mediation, mistral, model-selection]

  - text: "30s default timeout is too short for agentic tools (call_agent, multi-step reasoning). Use 90-120s; expose per-server override."
    tags: [mcp, timeout, agentic-tools]

  - text: "Retry on transient connection errors (httpx.ConnectError, RemoteProtocolError, ReadError) but NEVER on asyncio.TimeoutError — the latter just doubles the user wait without adding signal."
    tags: [retry, network, robustness]

  - text: "When a frontend handler swallows errors with only console.error, testers perceive it as a crash. Always surface errors to UI state with a recovery action."
    tags: [frontend, ux, error-handling]

  - text: "FastAPI HTTPException(detail=str) and HTTPException(detail=[{msg}]) coexist. Frontend error parsers must handle both forms."
    tags: [fastapi, frontend, error-handling]
