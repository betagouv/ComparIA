# Gitleaks config: default rules plus an allowlist for known false positives.
# Only paths are allowlisted, so a real key in any other file still fails the scan.

[extend]
useDefault = true

[[allowlists]]
description = "Known false positives in the git history, none of them secrets"
paths = [
  # Upstream FastChat code kept in early commits, flags Python identifiers
  '''^fastchat/''',
  # Model catalog, flags api_model_id values such as c4ai-aya-expanse-32b
  '''^(utils/models|data/legacy)/(generated-)?models\.json$''',
  # Plotly export, flags category labels embedded in the figure data
  '''^utils/ranking_methods/figures/dendogram\.html$''',
]
