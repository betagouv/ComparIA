<svg width="210" height="44" viewBox="0 0 210 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="CompaRAG">
  <!-- Icon: fork of ComparIA geometry, scaled ~5% of original (793×763 → ~40×38) -->
  <!-- Original circles r=231 at (281,482),(512,482),(397,281) → scale=0.052, offset to fit -->
  <!-- Scaled: r≈12, centers: left(14.6,25), right(26.6,25), top(20.6,14.6) -->
  <g transform="translate(2, 2)">
    <!-- Base circles -->
    <circle cx="14" cy="25" r="12" fill="#1f1f1f"/>
    <circle cx="27" cy="25" r="12" fill="#fa520f"/>
    <circle cx="20" cy="14" r="12" fill="#ffd900"/>

    <!-- Top+Right overlap → yellow -->
    <path d="M26.6 10.5 C29.8 12.3 32 15.6 32 19.4 C32 23.2 29.8 26.5 26.6 28.3 C23.4 26.5 21.2 23.2 21.2 19.4 C21.2 15.6 23.4 12.3 26.6 10.5Z" fill="#ffd900"/>
    <!-- Left+Top overlap → black -->
    <path d="M14 10.5 C17.2 12.3 19.4 15.6 19.4 19.4 C19.4 23.2 17.2 26.5 14 28.3 C10.8 26.5 8.6 23.2 8.6 19.4 C8.6 15.6 10.8 12.3 14 10.5Z" fill="#1f1f1f"/>
    <!-- Left+Right overlap → orange -->
    <path d="M20.3 25 C20.3 29.4 18.1 33.3 14.7 35.6 C13.8 35.1 12.9 34.5 12.1 33.8 C9.8 31.8 8.4 28.9 8.4 25.7 C8.4 22.5 9.8 19.6 12.1 17.6 C12.9 16.9 13.8 16.3 14.7 15.8 C18.1 18.1 20.3 21.1 20.3 25Z" fill="#fa520f"/>
    <!-- Center → ivory -->
    <circle cx="20" cy="22" r="3.5" fill="#fffaeb"/>
  </g>

  <!-- Wordmark -->
  <text x="48" y="28" font-family="Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="-0.6" fill="#1f1f1f">Compa</text>
  <text x="124" y="28" font-family="Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="-0.6" fill="#fa520f">RAG</text>
</svg>
