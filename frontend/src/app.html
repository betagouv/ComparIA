<!doctype html>
<html lang="%lang%" data-fr-scheme="%scheme%" data-fr-theme="%theme%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no" />
    <!-- Défini la couleur de thème du navigateur (Safari/Android) -->
    <meta name="theme-color" content="#6464f3" />
    <meta name="google-site-verification" content="1xrdIzQy45wIoAeeNvpRb9l8s_k5DjzMtrvbOzx6wMQ" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="%lang%" />
    <meta property="og:image" content="https://comparia.beta.gouv.fr//thumbnail-comparia.png" />
    <!-- 180×180 -->
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" href="/favicon/favicon.png" sizes="96x96" />
    <!-- 32×32 -->
    <link rel="shortcut icon" href="/favicon/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/favicon/manifest.webmanifest" crossorigin="use-credentials" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>

    <script>
      // Directly set scheme + theme to avoid initial flash
      const scheme = localStorage.getItem('scheme') || 'system'
      const theme =
        scheme === 'system'
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          : scheme

      setCookie('scheme', scheme)
      setCookie('theme', theme)

      function setCookie(name, value, days) {
        let expires = ''
        if (days) {
          const date = new Date()
          date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000)
          expires = '; expires=' + date.toUTCString()
        }
        document.cookie = name + '=' + value + expires + '; path=/'
      }
    </script>

    <!-- Matomo -->
    <script>
      ;(function () {
        var siteId = '%matomo_id%'.trim()
        var trackerBaseUrl = '%matomo_url%'.replace(/\/$/, '')
        var loaded = false

        window.compariaLoadAnalytics = function () {
          if (
            loaded ||
            !siteId ||
            !trackerBaseUrl ||
            localStorage.getItem('comparia:analytics-consent') !== 'accepted'
          )
            return
          loaded = true

          var _paq = (window._paq = window._paq || [])
          var u = trackerBaseUrl + '/'
          _paq.push(['setTrackerUrl', u + 'matomo.php'])
          _paq.push(['setSiteId', siteId])
          _paq.push(['requireConsent'])
          _paq.push(['setConsentGiven'])
          _paq.push(['disableCookies'])
          _paq.push(['setDoNotTrack', true])
          _paq.push(['enableLinkTracking'])
          _paq.push(['trackPageView'])
          var script = document.createElement('script')
          script.async = true
          script.src = u + 'matomo.js'
          document.head.appendChild(script)
        }

        window.addEventListener('comparia:analytics-choice', window.compariaLoadAnalytics)
        window.compariaLoadAnalytics()
      })()
    </script>
    <!-- End Matomo Code -->
  </body>
</html>
