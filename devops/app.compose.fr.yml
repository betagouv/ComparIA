services:
  frontend-fr:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.front
    depends_on:
      - backend-fr
    environment:
      PUBLIC_API_LOCAL_URL: "http://backend-fr:80"
      PUBLIC_API_URL: "${PUBLIC_API_URL:-https://comparia.beta.gouv.fr}"
    ports:
      - "3001:3000"

  backend-fr:
    env_file: ../.env.fr
    environment:
      LOGDIR: /data
      COMPARIA_DB_URI: "${COMPARIA_DB_URI_FR:-postgresql://postgres:postgres@postgres-fr:5432/comparia_fr}"
      COMPARIA_REDIS_HOST: redis-fr
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8001:80"
    depends_on:
      - postgres-fr
      - redis-fr

  postgres-fr:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comparia_fr
    volumes:
      - db-data-fr:/var/lib/postgresql/data
      - ./data/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5433:5432"

  redis-fr:
    image: redis
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  db-data-fr:
