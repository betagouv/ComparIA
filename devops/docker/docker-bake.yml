services:
  backend:
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        MATOMO_ID: ${MATOMO_ID:-}
        MATOMO_URL: ${MATOMO_URL:-}
      x-bake:
        tags:
          - ${REGISTRY:?REGISTRY is required}/comparia-backend:${GIT_COMMIT}

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../devops/docker/Dockerfile.front
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        MATOMO_ID: ${MATOMO_ID:-}
        MATOMO_URL: ${MATOMO_URL:-}
      x-bake:
        tags:
          - ${REGISTRY:?REGISTRY is required}/comparia-frontend:${GIT_COMMIT}
