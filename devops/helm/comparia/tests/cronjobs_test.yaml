suite: optional maintenance cronjobs
templates:
  - cronjob-ranking.yaml
  - cronjob-analyze.yaml
  - cronjob-publish.yaml
  - cronjob-purge-inactive.yaml
  - cronjob-purge-retention.yaml
values:
  - ../ci/values-lint.yaml
tests:
  - it: renders the ranking CronJob by default
    template: cronjob-ranking.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob

  - it: omits the ranking CronJob when disabled
    template: cronjob-ranking.yaml
    set:
      cronjobs.ranking.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the analyze CronJob by default
    template: cronjob-analyze.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the analyze CronJob when enabled
    template: cronjob-analyze.yaml
    set:
      cronjobs.analyze.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["./comparia-cli", "db", "lint", "--fix", "--with-llm-analyze"]

  - it: omits the purge-inactive CronJob by default
    template: cronjob-purge-inactive.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the purge-inactive CronJob with the configured retention
    template: cronjob-purge-inactive.yaml
    set:
      cronjobs.purgeInactive.enabled: true
      cronjobs.purgeInactive.months: 6
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["./comparia-cli", "db", "purge-inactive", "--months", "6", "--apply"]

  - it: gives the purge-inactive CronJob the backend env, SMTP and app URL included
    template: cronjob-purge-inactive.yaml
    set:
      cronjobs.purgeInactive.enabled: true
      config.appUrl: https://comparia.example
      config.smtp.host: smtp.example.com
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: COMPARIA_INSTANCE_NAME
            value: fr
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: SMTP_HOST
            value: smtp.example.com
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: COMPARIA_APP_URL
            value: https://comparia.example
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AUTH_SESSION_LENGTH_DAYS
            value: "30"

  - it: omits the purge-retention CronJob by default
    template: cronjob-purge-retention.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the purge-retention CronJob with the policy periods
    template: cronjob-purge-retention.yaml
    set:
      cronjobs.purgeRetention.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.schedule
          value: "50 4 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value:
            - ./comparia-cli
            - db
            - purge-retention
            - --ip-months
            - "3"
            - --comparison-months
            - "24"
            - --session-months
            - "12"
            - --prompt-check-months
            - "12"
            - --consent-years
            - "5"
            - --apply

  - it: passes overridden periods to the purge-retention CronJob
    template: cronjob-purge-retention.yaml
    set:
      cronjobs.purgeRetention.enabled: true
      cronjobs.purgeRetention.ipMonths: 1
      cronjobs.purgeRetention.consentYears: 6
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[4]
          value: "1"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[12]
          value: "6"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: COMPARIA_INSTANCE_NAME
            value: fr

  - it: toggles each cronjob independently of the others
    template: cronjob-ranking.yaml
    set:
      cronjobs.ranking.enabled: true
      cronjobs.analyze.enabled: true
      cronjobs.purgeInactive.enabled: true
      cronjobs.purgeRetention.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: renders the publish CronJob by default
    template: cronjob-publish.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-comparia-publish
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["uv", "run", "python", "-m", "utils.dataset.job"]

  - it: omits the publish CronJob when disabled
    template: cronjob-publish.yaml
    set:
      cronjobs.publish.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: ticks every ten minutes by default and lets the schedule be overridden
    template: cronjob-publish.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "*/10 * * * *"

  - it: takes the schedule from the value
    template: cronjob-publish.yaml
    set:
      cronjobs.publish.schedule: "*/30 * * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "*/30 * * * *"

  - it: forbids concurrent runs and stops a run after six hours
    template: cronjob-publish.yaml
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 21600

  - it: takes the deadline from the value
    template: cronjob-publish.yaml
    set:
      cronjobs.publish.activeDeadlineSeconds: 7200
    asserts:
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 7200

  - it: runs BLAS and OpenMP on a single thread
    template: cronjob-publish.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: OPENBLAS_NUM_THREADS
            value: "1"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: OMP_NUM_THREADS
            value: "1"

  - it: takes its resources from the dedicated publish block
    template: cronjob-publish.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.memory
          value: 2Gi
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 8Gi

  - it: does not share resources with the analyze CronJob
    template: cronjob-publish.yaml
    set:
      resources.cronjobs.limits.memory: 1Gi
      resources.publish.limits.memory: 12Gi
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 12Gi

  - it: uses the same image and secret as the other cronjobs
    template: cronjob-publish.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "ghcr.io/betagouv/comparia-backend:latest"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-comparia-secret

  - it: uses an existing secret like the other cronjobs
    template: cronjob-publish.yaml
    set:
      secrets.existingSecret: my-secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-secret
