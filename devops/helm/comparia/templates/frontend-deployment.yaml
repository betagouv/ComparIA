{{- /*
Host the readiness probe presents to the frontend, so SvelteKit's server-side
CORS emulation for its root `load` (which checks the request's own origin,
not PUBLIC_API_LOCAL_URL's) sees the same origin the backend's CORS
allow-list is configured for (config.appUrl / COMPARIA_APP_URL). Without
this, the probe hits the Pod IP directly and its origin never matches,
regardless of the backend's CORS config.
*/}}
{{- $probeHost := "" }}
{{- if .Values.config.appUrl }}
{{- $probeHost = (urlParse .Values.config.appUrl).host }}
{{- else if .Values.ingress.host }}
{{- $probeHost = .Values.ingress.host }}
{{- end }}
{{- /* The frontend only serves routes under ingress.path (e.g. "/arena/" -- see
ingress.yaml); "/" 404s once that's non-root, so the probe must match. */}}
{{- $probePath := printf "%s/" (trimSuffix "/" .Values.ingress.path) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comparia.fullname" . }}-frontend
  labels:
    {{- include "comparia.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      {{- include "comparia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "comparia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "comparia.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: {{ $probePath }}
              port: http
              {{- if $probeHost }}
              httpHeaders:
                - name: Host
                  value: {{ $probeHost | quote }}
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          envFrom:
            - secretRef:
                name: {{ include "comparia.secretName" . }}
          env:
            - name: PORT
              value: "80"
            - name: PUBLIC_API_URL
              value: {{ .Values.frontend.publicApiUrl | quote }}
            - name: PUBLIC_API_LOCAL_URL
              value: "http://{{ include "comparia.fullname" . }}-backend:{{ .Values.service.backend.port }}"
            - name: PUBLIC_DISABLED_LOCALES
              value: {{ .Values.frontend.disabledLocales | quote }}
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
