apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "comparia.fullname" . }}-backend
  labels:
    {{- include "comparia.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      {{- include "comparia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "comparia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "comparia.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uv
            - run
            - uvicorn
            - backend.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "80"
            - --timeout-graceful-shutdown
            - "60"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          envFrom:
            - secretRef:
                name: {{ include "comparia.secretName" . }}
          env:
            {{- include "comparia.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
