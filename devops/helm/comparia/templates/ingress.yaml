{{- if .Values.ingress.enabled }}
{{- $prefix := trimSuffix "/" .Values.ingress.path }}
{{- /* Every top-level backend route (app.include_router(...) plus the two bare
@app.get in backend/main.py), independent of ingress.path -- keep this list in
sync with main.py when adding a new router. */}}
{{- $backendRouteNames := list "counter" "maintenance/status" "models" "suggestions" "vote-tags" "arena" "auth" "admin" "settings" "statistics" "ranking" }}
{{- $backendRegexAlternatives := list }}
{{- range $backendRouteNames }}
{{- $backendRegexAlternatives = append $backendRegexAlternatives (printf "%s(/.*)?" .) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "comparia.fullname" . }}
  labels:
    {{- include "comparia.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
      http:
        paths:
          # Routes called directly by the browser (SSR data loading calls the
          # backend server-side over PUBLIC_API_LOCAL_URL instead, inside the
          # cluster, and never goes through this Ingress -- but +layout.ts is a
          # universal load, so it and anything else client-invoked still needs
          # a public route here too).
          #
          # ingress.path prefixes every route below. Left at the default "/", this
          # is a no-op and these backend routes need no rewriting -- they already
          # match the backend's own (unprefixed) route namespace 1:1. Non-root
          # values are only meant for the beta.gouv shared-domain topology (see
          # README) -- a separate release owns "/", and a second Ingress below
          # strips the prefix back off before it reaches the backend, since the
          # backend itself has no notion of ingress.path.
          {{- if not $prefix }}
          {{- range $backendRouteNames }}
          - path: /{{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "comparia.fullname" $ }}-backend
                port:
                  number: {{ $.Values.service.backend.port }}
          {{- end }}
          {{- end }}
          # Prefix pathType requires this to be exactly the prefix, no trailing
          # slash: ingress-nginx matches "/arena" and "/arena/..." alike, but
          # "/arena/" as a Prefix path requires the trailing slash in the
          # request too, so a link to bare "/arena" falls through to whatever
          # else owns "/" on this host instead of matching here.
          - path: {{ if $prefix }}{{ $prefix }}{{ else }}/{{ end }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "comparia.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontend.port }}
{{- if $prefix }}
---
# Non-root ingress.path only: the frontend calls the backend routes above
# client-side under its own base path (PUBLIC_BASE_PATH == ingress.path, for
# same-origin routing), but the backend's own routes are always unprefixed --
# it has no notion of ingress.path. Strip the prefix back off before forwarding.
# A separate Ingress because rewrite-target applies to every path on the object
# that carries it, and the frontend rule above must NOT be rewritten.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "comparia.fullname" . }}-api
  labels:
    {{- include "comparia.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ $prefix }}/({{ join "|" $backendRegexAlternatives }})
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "comparia.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
{{- end }}
{{- end }}
