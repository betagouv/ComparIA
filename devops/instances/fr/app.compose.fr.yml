services:
  frontend-fr:
    build:
      context: ../../../frontend
      dockerfile: ../devops/docker/Dockerfile.front
    depends_on:
      - backend-fr
    environment:
      PUBLIC_LANGUIA_DEBUG: "false"
      PUBLIC_API_LOCAL_URL: "http://backend-fr:80"
      PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8001}"
      PUBLIC_API_DEV_MODE: "true"
    ports:
      - "127.0.0.1:3001:3000"
    mem_limit: 512m
    cpus: 1
    pids_limit: 200
    networks:
      - comparia-net

  backend-fr:
    environment:
      LOGDIR: /data
      LANGUIA_DEBUG: "false"
      # This instance sits behind exactly one reverse-proxy hop (Caddy).
      COMPARIA_TRUSTED_PROXY_COUNT: "1"
      COMPARIA_INSTANCE_NAME: fr
      COMPARIA_DB_URI: "${COMPARIA_DB_URI_FR:?COMPARIA_DB_URI_FR is required}"
      COMPARIA_REDIS_HOST: redis
      COMPARIA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      METRICS_TOKEN:
      OPENROUTER_API_KEY:
      ALBERT_KEY:
      # Read once, by the migration that creates the destination table:
      # HF_PUSH_DATASET_KEY:
      # HF_PUSH_DATASET_PATH: "ministere-culture/comparia"
      ALTCHA_HMAC_KEY:
      SENTRY_SAMPLE_RATE: "1.0"
      SENTRY_ENV: "dev-fr"
      SENTRY_FRONT_DSN: "https://454e45b18f4ad93227ac60659a7d373c@sentry.incubateur.net/164"
      SENTRY_DSN: "https://63791cc350514632a03f9907989499d7@sentry.incubateur.net/161"
    build:
      context: ../../..
      dockerfile: devops/docker/Dockerfile
    ports:
      - "127.0.0.1:8001:80"
    mem_limit: 1g
    cpus: 2
    pids_limit: 200
    networks:
      - comparia-net

networks:
  comparia-net:
    external: true
