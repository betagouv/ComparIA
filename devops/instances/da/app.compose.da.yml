services:
  frontend-da:
    build:
      context: ../../../frontend
      dockerfile: ../devops/docker/Dockerfile.front
    depends_on:
      - backend-da
    environment:
      PUBLIC_LANGUIA_DEBUG: "false"
      PUBLIC_API_LOCAL_URL: "http://backend-da:80"
      PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8002}"
      PUBLIC_API_DEV_MODE: "true"
    ports:
      - "127.0.0.1:3002:3000"
    mem_limit: 512m
    cpus: 1
    pids_limit: 200
    networks:
      - comparia-net

  backend-da:
    environment:
      LOGDIR: /data
      LANGUIA_DEBUG: "false"
      COMPARIA_TRUSTED_PROXY_COUNT: ${COMPARIA_TRUSTED_PROXY_COUNT:?COMPARIA_TRUSTED_PROXY_COUNT is required}
      COMPARIA_INSTANCE_NAME: da
      COMPARIA_DB_URI: "${COMPARIA_DB_URI_DA:?COMPARIA_DB_URI_DA is required}"
      COMPARIA_REDIS_HOST: redis
      COMPARIA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      METRICS_TOKEN:
      OPENROUTER_API_KEY:
      ORDBOGEN_API_KEY:
      # Read once, by the migration that creates the destination table:
      # HF_PUSH_DATASET_KEY:
      # HF_PUSH_DATASET_PATH: "danish-foundation-models/ai-arenaen"
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY is required}
      SENTRY_SAMPLE_RATE: "1.0"
      SENTRY_ENV: "dev-da"
      SENTRY_FRONT_DSN: "https://454e45b18f4ad93227ac60659a7d373c@sentry.incubateur.net/164"
      SENTRY_DSN: "https://63791cc350514632a03f9907989499d7@sentry.incubateur.net/161"
    build:
      context: ../../..
      dockerfile: devops/docker/Dockerfile
    ports:
      - "127.0.0.1:8002:80"
    mem_limit: 1g
    cpus: 2
    pids_limit: 200
    networks:
      - comparia-net

networks:
  comparia-net:
    external: true
